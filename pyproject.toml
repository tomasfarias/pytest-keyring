[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

[project]
name = "pytest-keyring"
version = "1.1.1"
description = "A Pytest plugin to access the system's keyring to provide credentials for tests"
readme = "README.md"
keywords = [ "keyring", "pytest", "pytest-plugin" ]
license = "MIT"
authors = [
  { name = "Tomás Farías Santana", email = "tomas@tomasfarias.dev" },
]
requires-python = ">=3.8"
classifiers = [
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "keyring>=24.2",
  "pytest>=8.0.2",
]
urls.Repository = "https://github.com/tomasfarias/pytest-keyring"
entry-points.pytest11.pytest_keyring = "pytest_keyring"

[dependency-groups]
dev = [
  "black>=23.9",
  "mypy>=1.5",
  "pre-commit>=3.4",
  "ruff>=0.0.289",
  "secretstorage>=3.3",
  "tox>=4.11",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/pytest_keyring" ]

[tool.uv]
exclude-newer = "14 days"

[tool.ruff]
per-file-ignores."__init__.py" = [ "F401" ]
per-file-ignores."src/*" = [ "E501" ]

[tool.mypy]
mypy_path = "src"
namespace_packages = false
show_error_codes = true
strict = true
warn_unreachable = true
overrides = [ { module = "tests.*", allow_untyped_defs = true } ]
